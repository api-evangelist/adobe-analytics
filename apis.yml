apis:
- name: Adobe Analytics Livestream API
  description: >-
    The Livestream API is a reporting feature in Adobe Analytics that allows clients to receive traffic
    data processed by Adobe Analytics in real time. Hits are streamed to the client on a hit-by-hit basis
    in the same order and rate that they are processed by Adobe servers.
  image: https://www.adobe.com/content/dam/cc/icons/analytics.svg
  baseUrl: https://livestream.adobe.net/api/1/stream
  tags:
  - Analytics
  - Data
  - Real-Time
  - Streaming
