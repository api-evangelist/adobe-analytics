- name: Adobe Analytics Data Insertion API
  description: >-
    The Data Insertion API allows server-side data submission to Adobe Analytics one event at a time using
    HTTP GET or POST requests. Unlike the Bulk Data Insertion API which processes compressed CSV files
    in batches, this API handles individual hit submissions in real time and is explicitly excluded from
    the Analytics 1.4 API end-of-life scheduled for August 12, 2026.
  image: https://www.adobe.com/content/dam/cc/icons/analytics.svg
  baseUrl: https://sc.omtrdc.net/b/ss
  tags:
  - Analytics
  - Data Collection
  - Real-Time
  - Server-Side
