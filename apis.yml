- name: Adobe Analytics 1.4 API
  description: >-
    The Adobe Analytics 1.4 APIs provide programmatic access to reporting, classifications, data sources,
    and report suite configuration. This version is deprecated and scheduled for end-of-life on August
    12, 2026, after which all endpoints will cease to function. The Data Insertion API is excluded from
    this end-of-life.
  image: https://www.adobe.com/content/dam/cc/icons/analytics.svg
