notes: >-
  There is NO first-party Adobe client library for the Analytics 2.0 REST API in any
  language other than JavaScript. Every other official Adobe package found is a
  client-side data-COLLECTION SDK (web via alloy, mobile via the AEP/ACP mobile SDKs) —
  they send data into Analytics, they do not call the reporting/admin API. Java, .NET, Go,
  Ruby, PHP and Rust consumers of the 2.0 API must call it over plain HTTP or use a
  community wrapper. Recorded as an absence, not omitted.
