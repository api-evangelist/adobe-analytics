description: >-
  First-party and notable community client libraries for the Adobe Analytics 2.0 APIs.
  Adobe ships an official JavaScript SDK via the Adobe I/O (App Builder) Core SDK family;
  Adobe publishes Python usage resources (example code) rather than a packaged Python SDK,
  so the widely used Python wrapper below is community-maintained. Versions and publish
  dates were read from the registry metadata endpoints on 2026-08-13.
