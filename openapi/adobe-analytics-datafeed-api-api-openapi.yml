          format: int32
    DataFeedList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataFeedView'
    DataFeedUpdateBody_User:
      type: object
      properties:
        columnPreset:
          type: integer
          format: int32
        notes:
          type: string
        dynamicLookups:
          type: boolean
        replaceEscapedChars:
          type: boolean
        metadata:
          $ref: '#/components/schemas/UpdateMetadata_User'
        schedule:
          $ref: '#/components/schemas/Schedule_User'
        packaging:
          $ref: '#/components/schemas/Packaging_User'
        delivery:
          $ref: '#/components/schemas/Delivery_User'
        lateHits:
          $ref: '#/components/schemas/LateHits_User'
    ExtendedMetadata:
      type: object
      properties:
        feedId:
          type: integer
          format: int32
        feedState:
          type: string
        timeZone:
          type: string
        createdBy:
          type: string
        creationDate:
          type: string
        modifiedBy:
          type: string
        modificationDate:
          type: string
        legacyTransport:
          $ref: '#/components/schemas/LegacyTransportConfig'
      description: Extended Metadata for DataFeedExtendedView
    ReportSuiteList_User:
      type: object
      properties:
        rsids:
          type: array
          items:
            type: string
    DataFeedView:
      properties:
        dynamicLookups:
          type: boolean
        schedule:
