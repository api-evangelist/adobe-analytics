    DataFeedRequestView:
      type: object
      properties:
        rsid:
          type: string
        feedId:
          type: integer
          format: int32
        feedName:
          type: string
        feedState:
          type: string
        requestId:
          type: integer
          format: int64
        submittedDate:
          type: string
        runCount:
          type: integer
          format: int32
        runAttempt:
          type: string
        completeDate:
          type: string
        requestPeriodBegin:
          type: string
        requestPeriodEnd:
          type: string
        requestState:
          type: string
        useUTC:
          type: integer
          format: int32
        errorCode:
          type: integer
          format: int32
        errorMsg:
          type: string
        timezone:
          type: string
    Packaging_User:
      type: object
      properties:
        type:
          type: string
        chunkSize:
          type: integer
          format: int32
        compression:
          type: string
        manifest:
          type: string
        noDataManifest:
          type: boolean
    DataFeedRequestsSearchBody:
      type: object
      properties:
        rsids:
          type: array
          items:
            type: string
        feedIds:
          type: array
          items:
            type: integer
            format: int32
        requestStates:
          type: array
          items:
            type: string
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sortOrder:
          type: string
        orderBy:
          type: string
        billingCustomerId:
          type: integer
          format: int32
        useUtc:
          type: boolean
        minRequestPeriodStartDate:
          type: string
        maxRequestPeriodStartDate:
          type: string
        minAttemptDate:
          type: string
        maxAttemptDate:
          type: string
        minCompletionDate:
          type: string
        maxCompletionDate:
          type: string
        minSubmittedDate:
          type: string
        maxSubmittedDate:
          type: string
    Delivery_User:
      type: object
      properties:
        cloudLocationUUID:
          type: string
        notificationEmail:
          type: array
          items:
            type: string
    LegacyTransportConfig:
