          format: int64
        protocol:
          type: string
        hostname:
          type: string
        port:
          type: integer
          format: int32
        directoryPath:
          type: string
        prefix:
          type: string
        skipRename:
          type: boolean
        bucket:
          type: string
        container:
          type: string
        accountName:
          type: string
        projectId:
          type: string
        exportLocationId:
          type: string
    DataFeedRequestListView:
      properties:
        offset:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataFeedRequestView'
        limit:
          type: integer
          format: int32
    UpdateMetadata_User:
      type: object
      properties:
        feedId:
          type: integer
          format: int32
        feedState:
          type: string
      description: Metadata for the DataFeedUpdateBody
    Packaging:
      type: object
      properties:
        type:
          type: string
        chunkSize:
          type: integer
          format: int32
        compression:
          type: string
        manifest:
          type: string
        noDataManifest:
          type: boolean
    DataFeedCreateBody_User:
      required:
      - columnPreset
      - delivery
      - feedName
      - rsid
      - schedule
