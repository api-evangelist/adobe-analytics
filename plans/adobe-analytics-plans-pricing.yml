description: >-
  Adobe Analytics is an enterprise product sold on contact-sales contracts. Adobe
  publishes NO list price, no public per-tier quota, and no self-service signup: there is
  no plan an API consumer can read a number off. Adobe markets three packages — Select,
  Prime and Ultimate — priced by committed server-call volume and feature bundle. API
  access is included with the underlying Analytics license and is not separately metered
  or separately purchasable.
notes: >-
  A developer cannot obtain Adobe Analytics API access without an existing Adobe Analytics
  contract and an Adobe Developer Console project provisioned by an org admin. For catalog
  purposes this is a fully sales-gated commercial surface.
